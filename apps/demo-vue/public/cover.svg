<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Neon Room album artwork</title>
  <description id="description">Abstract lime sound waves crossing a dark recording studio.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#20242a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#8cff78" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8cff78" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="800" height="800" rx="72" fill="url(#background)"/>
  <circle cx="585" cy="185" r="260" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="#a3ff7a" stroke-linecap="round">
    <path d="M92 442c98-196 160 196 258 0s160 196 258 0 68 48 100 0" stroke-width="25"/>
    <path d="M92 516c98-130 160 130 258 0s160 130 258 0 68 32 100 0" stroke-width="10" opacity="0.58"/>
  </g>
  <text x="82" y="112" fill="#f4f7f0" font-family="ui-monospace, monospace" font-size="25" letter-spacing="9">AUDIO NATIVE</text>
  <text x="82" y="690" fill="#f4f7f0" font-family="ui-sans-serif, sans-serif" font-size="88" font-weight="700">NEON</text>
  <text x="82" y="752" fill="#a3ff7a" font-family="ui-sans-serif, sans-serif" font-size="46" font-weight="600" letter-spacing="18">ROOM</text>
</svg>
